name: Reference and native checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install mojo==1.1.0
      - name: Verify Python reference behavior
        run: python -m unittest discover -s . -p 'test_*.py' -v
      - name: Compile the separate native kernel
        run: mojo build core.mojo -o /tmp/native-kernel
